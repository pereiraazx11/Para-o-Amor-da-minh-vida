<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro & Laura</title>
  <style>
    /* Estilos básicos para o site */
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      text-align: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #e91e63;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* Estilo para o player de áudio */
    audio {
      margin-top: 25px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Pedro & Laura</h1>
    <p>Bem-vindos ao nosso site especial!</p>

    <!-- PLAYER DE MÚSICA -->
    <audio controls autoplay loop>
      <source src="pela_luz_dos_olhos_teus.mp3" type="audio/mpeg">
      Seu navegador não suporta o elemento de áudio.
    </audio>
  </div>

</body>
</html>
